<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>العروض التقديمية</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1E3A56"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="fonts/fonts.css">
<style>body{margin:0;background:#0f2a2e;color:#f4f1e8;font-family:Tajawal,sans-serif;padding:40px 20px;max-width:760px;margin-inline:auto}
h1{color:#e3b95c}a{display:block;background:#ffffff12;border:1px solid #ffffff24;border-radius:18px;padding:20px 24px;margin:14px 0;color:inherit;text-decoration:none;font-size:22px}a small{display:block;color:#a9c1c0;font-size:16px;margin-top:4px}a:hover{border-color:#e3b95c}</style>
</head><body><h1>العروض التقديمية</h1><p id="off" style="color:#a9c1c0;font-size:15px"></p><div id="l"></div>
<script src="decks/index.js"></script>
<script>l.innerHTML=DECKS.map(d=>`<a href="${d.url||'player.html?deck='+d.id}">${d.title}<small>${d.desc||''}</small></a>`).join('')</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
</body></html>
