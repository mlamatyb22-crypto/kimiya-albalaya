<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="رياضياتنا حياة: كتاب رياضيات تفاعلي لثالث ثانوي مسارات">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>رياضياتنا حياة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: دفتر رسم بياني — شريط فهرس جانبي على الشاشات الواسعة، وصفحة درس متسلسلة (فكرة ← تجربة ← مثال ← قوانين ← أسئلة ← تفكير عليا). الوضع الداكن = سبورة. */
:root{
  --paper:#f7f8f4; --sheet:#ffffff; --grid:#e3e8ef; --ink:#1d2a44; --muted:#5b6780;
  --blue:#1f5fbf; --blue-soft:#e4edfb; --marker:#ffd84d; --marker-soft:#fff5c7;
  --ok:#1d8a5b; --ok-soft:#e1f4ea; --bad:#c8413a; --bad-soft:#fbe6e4;
  --plum:#7b3fa8; --plum-soft:#f1e8f8; --line:#d5dbe5;
  --c1:#1f5fbf; --c2:#d9542b; --c3:#1d8a5b; --c4:#7b3fa8; --axis:#33405a; --gridln:#e6eaf1;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#18221f; --sheet:#1f2b27; --grid:#26332f; --ink:#eef2ea; --muted:#a9b8b0;
  --blue:#8fc1ff; --blue-soft:#243a4a; --marker:#ffe27a; --marker-soft:#3b3a22;
  --ok:#7fdcaa; --ok-soft:#1f3a2f; --bad:#ff9a8f; --bad-soft:#43272a;
  --plum:#d6a8ff; --plum-soft:#34283f; --line:#33433d;
  --c1:#8fc1ff; --c2:#ffab7a; --c3:#7fdcaa; --c4:#d6a8ff; --axis:#d7e0da; --gridln:#2b3a35;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#18221f; --sheet:#1f2b27; --grid:#26332f; --ink:#eef2ea; --muted:#a9b8b0;
  --blue:#8fc1ff; --blue-soft:#243a4a; --marker:#ffe27a; --marker-soft:#3b3a22;
  --ok:#7fdcaa; --ok-soft:#1f3a2f; --bad:#ff9a8f; --bad-soft:#43272a;
  --plum:#d6a8ff; --plum-soft:#34283f; --line:#33433d;
  --c1:#8fc1ff; --c2:#ffab7a; --c3:#7fdcaa; --c4:#d6a8ff; --axis:#d7e0da; --gridln:#2b3a35;
  color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.35;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}

/* ---------- math ---------- */
.m{font-family:var(--f-math);font-size:1.08em;white-space:nowrap;unicode-bidi:isolate;direction:ltr;display:inline-block}
.m i{font-style:italic}
.m .fn{font-style:normal}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;font-size:.92em}
.fr>.nu{border-bottom:1.3px solid currentColor;padding:0 .2em;line-height:1.25}
.fr>.de{padding:0 .2em;line-height:1.25}
.rt{display:inline-flex;align-items:flex-start;white-space:nowrap}
.rt .rs{font-size:1.05em;line-height:1}
.rt .rc{border-top:1.3px solid currentColor;padding:0 .1em;margin-top:.12em;line-height:1.2}
.rt .ri{font-size:.62em;margin-left:.1em;margin-right:-.45em;line-height:1}
.m sup,.m sub{font-size:.72em}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
.top .brand{font-family:var(--f-display);font-size:1.15rem;font-weight:700;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;min-width:0}
.top .brand b{background:var(--marker);color:#1d2a44;padding:0 8px;border-radius:6px}
.top .sp{flex:1}
.xp{display:flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--marker-soft);padding:2px 12px;border-radius:999px;white-space:nowrap}
.menu-btn{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:4px 12px;display:none;white-space:nowrap}
.top .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.top .brand span{font-size:1rem}.xp>span:first-child{display:none}}
.wrap{display:grid;grid-template-columns:290px minmax(0,1fr);gap:0;max-width:1280px;margin:0 auto}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);align-self:start;height:calc(100vh - 70px);overflow:auto;padding:18px 12px 40px;border-left:1px solid var(--line);background:color-mix(in srgb,var(--sheet) 82%,transparent)}
.toc h4{font-family:var(--f-display);font-size:.95rem;margin:16px 8px 6px;color:var(--muted);font-weight:500}
.toc a{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.93rem;line-height:1.4}
.toc a:hover{background:var(--blue-soft)}
.toc a.on{background:var(--blue);color:var(--sheet)}
.toc a .no{font-family:var(--f-math);font-variant-numeric:tabular-nums;min-width:2.2em;direction:ltr;text-align:center;opacity:.8}
.toc a .st{margin-inline-start:auto;font-size:.8rem;letter-spacing:1px;color:var(--marker);text-shadow:0 0 1px #8a6d00}
.toc a.on .st{color:var(--marker)}
.toc .tools a{font-weight:600}
main{min-width:0;padding-block:24px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:block}
  nav.toc{position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);right:0;bottom:auto;left:auto;width:min(320px,88vw);height:calc(100vh - 56px - env(safe-area-inset-top,0px));height:calc(100dvh - 56px - env(safe-area-inset-top,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:25;transform:translateX(105%);transition:transform .25s;box-shadow:-6px 0 30px rgba(0,0,0,.18);background:var(--sheet)}
  nav.toc.open{transform:none}
  body.no-scroll{overflow:hidden}
}

/* ---------- blocks ---------- */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px clamp(16px,3vw,28px)}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h .tag{font-family:var(--f-display);font-size:.8rem;letter-spacing:.5px;padding:2px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.sec-h h2{font-size:1.3rem}
.hero-l{padding:26px clamp(16px,3vw,30px);border-radius:var(--r);background:var(--blue);color:#fff;position:relative;overflow:hidden}
:root[data-theme="dark"] .hero-l{color:#10201a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero-l{color:#10201a}}
.hero-l .unit{font-size:.9rem;opacity:.85}
.hero-l h1{font-size:clamp(1.6rem,4vw,2.3rem);margin-top:4px}
.hero-l h1 .num{font-family:var(--f-math);direction:ltr;display:inline-block;background:var(--marker);color:#1d2a44;border-radius:8px;padding:0 10px;margin-inline-end:10px}
.hero-l .goal{margin-top:10px;max-width:60ch;opacity:.95}
.steps-nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.steps-nav a{font-size:.85rem;text-decoration:none;color:inherit;border:1px solid color-mix(in srgb,currentColor 40%,transparent);padding:2px 12px;border-radius:999px}
.steps-nav a:hover{background:color-mix(in srgb,currentColor 15%,transparent)}
.idea p{margin:0 0 10px;max-width:68ch}
.tip{border-inline-start:5px solid var(--marker);background:var(--marker-soft);padding:10px 14px;border-radius:8px;margin-top:8px}
.tip b{font-family:var(--f-display)}

/* lab */
.lab{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:720px){.lab{grid-template-columns:minmax(0,1fr)}}
.cv-box{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sheet)}
.cv-box canvas{display:block;width:100%;aspect-ratio:1/1;max-width:100%;touch-action:none}
.ctrls{display:flex;flex-direction:column;gap:12px;min-width:0}
.ctrl label{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;font-weight:600}
.ctrl label output{font-family:var(--f-math);direction:ltr;font-variant-numeric:tabular-nums;background:var(--blue-soft);color:var(--blue);padding:0 8px;border-radius:6px}
.ctrl input[type=range]{width:100%;accent-color:var(--blue)}
.ctrl select{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:inherit;font-family:var(--f-math)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:3px 10px;font-size:.9rem}
.seg button.on{background:var(--blue);color:var(--sheet);border-color:var(--blue)}
.readout{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:.95rem;line-height:1.9}
.readout .big{font-family:var(--f-display);font-size:1.05rem}
.badge{display:inline-block;padding:0 10px;border-radius:999px;font-weight:700;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.inf{background:var(--plum-soft);color:var(--plum)}
.play{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--ink);color:var(--sheet);border-radius:999px;padding:5px 16px;font-weight:600;align-self:flex-start}
.lab-note{font-size:.85rem;color:var(--muted);margin-top:8px}

/* example */
.ex-q{font-weight:600;margin-bottom:10px}
.ex-steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.ex-steps li{counter-increment:st;display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-radius:8px;background:var(--paper);animation:pop .3s ease}
.ex-steps li::before{content:counter(st);font-family:var(--f-math);flex:none;width:1.7em;height:1.7em;display:grid;place-items:center;border-radius:50%;background:var(--blue);color:var(--sheet);font-size:.85rem}
.ex-steps li.final{background:var(--ok-soft)}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
.btn{border:1px solid var(--blue);background:var(--sheet);color:var(--blue);border-radius:999px;padding:5px 16px;font-weight:600}
.btn.fill{background:var(--blue);color:var(--sheet)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* rules */
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rule{perspective:900px;min-height:150px;border:0;background:none;padding:0;text-align:inherit}
.rule .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .5s;transform-style:preserve-3d}
.rule.flip .in{transform:rotateY(180deg)}
.rule .fa,.rule .fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.rule .fa{background:var(--marker-soft);border:1px solid color-mix(in srgb,var(--marker) 60%,var(--line))}
.rule .fb{background:var(--sheet);border:2px solid var(--blue);transform:rotateY(180deg);justify-content:center}
.rule .nm{font-family:var(--f-display);font-size:1.02rem}
.rule .hint{font-size:.82rem;color:var(--muted);margin-top:auto}
.rule .fb .fx{font-size:1.02rem;line-height:2}
.rule .kn{position:absolute;top:8px;left:10px;font-size:.78rem;padding:0 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-weight:700}
.memo-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:.92rem}
.meter{flex:1;min-width:140px;height:10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}

/* quiz */
.qs{display:flex;flex-direction:column;gap:14px;counter-reset:q}
.q{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--sheet)}
.q .qt{font-weight:600;display:flex;gap:8px}
.q .qt::before{counter-increment:q;content:counter(q);font-family:var(--f-math);flex:none;color:var(--blue);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:10px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;text-align:start;display:flex;gap:8px;align-items:center;min-width:0}
.opt .k{font-family:var(--f-math);flex:none;width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;background:var(--sheet);border:1px solid var(--line);font-size:.85rem}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb-msg{margin-top:10px;padding:8px 12px;border-radius:8px;font-size:.95rem}
.fb-msg.ok{background:var(--ok-soft)}
.fb-msg.bad{background:var(--bad-soft)}
.score-line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-weight:600}

/* HOTS */
.hots{display:flex;flex-direction:column;gap:12px}
.hot{border:1.5px solid var(--plum);border-radius:12px;padding:14px 16px;background:var(--plum-soft)}
.hot .lvl{font-size:.78rem;font-weight:700;color:var(--plum);letter-spacing:.3px}
.hot .qt{font-weight:600;margin:4px 0 8px}
.hot .rev{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--sheet)}
.hot .btn{border-color:var(--plum);color:var(--plum)}
.hot textarea{width:100%;min-height:64px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:inherit;padding:8px}

/* home */
.cover{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,36px);overflow:hidden}
@media (max-width:720px){.cover{grid-template-columns:minmax(0,1fr)}}
.cover h1{font-size:clamp(2rem,6vw,3.2rem)}
.cover h1 mark{background:linear-gradient(transparent 55%,var(--marker) 55%);color:inherit;padding:0 4px}
.cover p{max-width:52ch;color:var(--muted)}
.cover canvas{width:100%;aspect-ratio:1/1;max-width:100%}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-math);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
.units{display:flex;flex-direction:column;gap:18px}
.unit-card h2{font-size:1.2rem;margin-bottom:10px}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.lcard{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}
.lcard:hover{border-color:var(--blue)}
.lcard .no{font-family:var(--f-math);color:var(--blue);direction:ltr;text-align:end;font-weight:600}
.lcard .t{font-weight:600;line-height:1.5}
.lcard .stars{color:#e0b000;letter-spacing:2px;font-size:.95rem}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:6px}
.how div{background:var(--paper);border-radius:10px;padding:10px 12px;font-size:.9rem}
.how b{display:block;font-family:var(--f-display)}

/* flash */
.flash-stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.flash{width:min(520px,100%);min-height:230px;perspective:1000px;border:0;background:none;padding:0}
.flash .in{position:relative;min-height:230px;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .fa,.flash .fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px}
.flash .fa{background:var(--marker-soft);border:2px solid var(--marker)}
.flash .fb{background:var(--sheet);border:2px solid var(--blue);transform:rotateY(180deg);font-size:1.12rem;line-height:2.1}
.flash .les{font-size:.85rem;color:var(--muted)}
.flash .nm{font-family:var(--f-display);font-size:1.4rem}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:999px;font-weight:600;z-index:40;transition:transform .3s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:22;display:none}
.overlay.show{display:block}
@media (min-width:901px){.overlay{display:none!important}}
</style>
</head>
<body>
<style>
.m .lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05}
.m .lim .ls{font-size:.62em}
.cover-lab canvas{aspect-ratio:1/1}

.ix-btn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;font-weight:700;background:var(--blue);color:var(--sheet);border-radius:10px;padding:5px 14px}
.ix-btn:hover{filter:brightness(1.1)}
.start-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.start{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--sheet);border-radius:12px;padding:10px 14px;border:2px solid transparent}
.start span{font-size:.82rem;color:var(--muted)}
.start.vid{background:var(--marker);color:#1d2a44}
.start.vid span{color:#3b4660}
.start:hover{border-color:var(--marker)}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.sum-box{border-radius:14px;padding:14px 16px;border:1.5px solid var(--line);min-width:0}
.sum-box.c0{background:var(--blue-soft)}.sum-box.c1{background:var(--marker-soft)}.sum-box.c2{background:var(--ok-soft)}.sum-box.c3{background:var(--plum-soft)}.sum-box.c4{background:var(--bad-soft)}
.sum-box h3{font-size:1rem;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.sum-box h3 .n{font-family:var(--f-math);width:1.7em;height:1.7em;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:var(--sheet);font-size:.85rem}

 ]},

{id:'1-4', unit:'u1', title:'القيم القصوى ومتوسط معدل التغير', lab:'sec',

 ],

  ['عظمى مطلقة','$f(b) ≥ f(x)$ لكل $x$ في مجال الدالة'],

 ],

 ],

 qs:[

{id:'1-5', unit:'u1', title:'الدوال الرئيسية (الأم) والتحويلات الهندسية', lab:'trans',
 goal:'أتعرّف الدوال الأم وخصائصها، وأمثّل التحويلات: الانسحاب والانعكاس والتمدد.',
 idea:[
  '<b>الدالة الأم</b> هي أبسط دالة في عائلتها، مثل: $x$ و $x^{2}$ و $x^{3}$ و $@frac{1}{x}$ و $|x|$ و $@sqrt{x}$ و $[x]$.',
  'من الدالة الأم نحصل على منحنيات العائلة بالتحويلات: <b>الانسحاب</b> يحرك المنحنى، و<b>الانعكاس</b> يعطي صورة مرآة، و<b>التمدد</b> يضيّق المنحنى أو يوسّعه.',
  'في الصورة $g(x) = a·f(x − h) + k$ : $h$ انسحاب أفقي، $k$ انسحاب رأسي، $a$ تمدد رأسي (وإن كانت سالبة: انعكاس).'
 ],
 tip:'داخل القوس يعمل «بالعكس»: $f(x − 3)$ تنسحب <b>يمينًا</b> 3 وحدات، و $f(x + 3)$ تنسحب <b>يسارًا</b>.',
 rules:[
  ['انسحاب رأسي','$f(x) + k$ : لأعلى إذا $k > 0$ ، لأسفل إذا $k < 0$'],
  ['انسحاب أفقي','$f(x − h)$ : يمينًا إذا $h > 0$ ، يسارًا إذا $h < 0$'],
  ['انعكاس حول x','$−f(x)$'],
  ['انعكاس حول y','$f(−x)$'],
  ['تمدد رأسي','$a·f(x)$ : توسع إذا $a > 1$ ، تضييق إذا $0 < a < 1$'],
  ['تمدد أفقي','$f(ax)$ : تضييق إذا $a > 1$ ، توسع إذا $0 < a < 1$'],
  ['القيمة المطلقة','$|f(x)|$ : الجزء تحت المحور x ينعكس لأعلاه<br>$f(|x|)$ : الجزء الأيمن ينعكس مكان الأيسر']
 ],
 rq:[
  ['ما الانسحاب الذي يُجرى على $x^{3}$ للحصول على $(x − 7)^{3}$ ؟',['7 وحدات لأسفل','7 وحدات لأعلى','7 وحدات لليسار','7 وحدات لليمين'],3,'$h = 7 > 0$ ⇐ يمينًا.'],
  ['التحويل الذي يكوّن صورة مرآة للمنحنى بالنسبة لمستقيم:',['الدوران','الانسحاب','الانعكاس','التمدد'],2,'الانعكاس = مرآة.'],
  ['تحويل غير قياسي يؤدي إلى تضييق أو توسيع المنحنى:',['الدوران','الانسحاب','الانعكاس','التمدد'],3,'التمدد يغيّر الشكل لا الموقع فقط.'],
  ['الدالة الأم لـ $f(x) = −(x + 3)^{3}$ :',['$(x + 3)^{3}$','$x^{2}$','$x^{3}$','$−x^{3}$'],2,'أبسط دالة في العائلة.']
 ],
 ex:{q:'عيّن الدالة الأم لـ $g(x) = 3|x| − 4$ ثم صف العلاقة بين المنحنيين.',
  s:['الدالة الأم: $f(x) = |x|$','المعامل $3 > 1$ ⇐ توسع رأسي (يضيق شكل V).','$−4$ ⇐ انسحاب 4 وحدات لأسفل.','الرأس ينتقل من $(0,0)$ إلى $(0,−4)$.']},
 qs:[
  ['أي منحنيات الدوال ناتج عن توسع رأسي ثم انعكاس حول المحور $x$ لمنحنى $x^{2}$ ؟',['$@frac{1}{3}x^{2}$','$−3x^{2}$','$−@frac{1}{x^{2} + 3}$','$−@frac{1}{3}x^{2}$'],1,'توسع: $a > 1$ ، وانعكاس: إشارة سالبة.'],
  ['ما الانسحابات التي أُجريت على $[x]$ لنحصل على $[x + 9] − 5$ ؟',['9 يسارًا و 5 لأسفل','9 يمينًا و 5 لأسفل','5 يسارًا و 9 لأسفل','5 يمينًا و 9 لأعلى'],0,'$x + 9$ يسارًا، $−5$ لأسفل.'],
  ['ما التحويلات على $[x]$ لتمثيل $2[x − 3] + 4$ ؟',['توسع رأسي، 3 يمينًا، 4 لأعلى','تضييق رأسي، 3 يمينًا، 4 لأسفل','توسع رأسي، 3 يسارًا، 4 لأعلى','تضييق، 3 يسارًا، 4 لأعلى'],0,'$a = 2$ توسع، $x − 3$ يمينًا، $+4$ لأعلى.'],
  ['صف العلاقة بين $g(x) = −|x| − 2$ و $f(x) = |x|$ :',['انعكاس حول $x$ ثم 2 لأسفل','انعكاس حول $y$ ثم 2 لأسفل','2 لليسار','انعكاس حول $x$ ثم 2 لأعلى'],0,'الإشارة السالبة خارج المطلق ⇐ انعكاس حول $x$.'],
  ['الدالة $g(x) = @frac{4}{x + 1}$ هي منحنى $@frac{1}{x}$ بعد:',['توسع رأسي 4 وانسحاب 1 يسارًا','توسع 4 وانسحاب 1 يمينًا','انسحاب 4 لأعلى','تضييق وانسحاب 1 يسارًا'],0,'$4·f(x + 1)$']
 ],
 hots:[

  ['تبرير','لماذا لا يتغير منحنى $f(x) = x^{2}$ عند انعكاسه حول المحور $y$ ؟','ما نوع الدالة $x^{2}$ ؟','لأنها زوجية: $f(−x) = f(x)$ ، أي متماثلة حول المحور $y$.'],
  ['إبداع','اكتب دالة جذر تربيعي رأسها $(−2, 5)$ ومنحناها ينعكس حول المحور $x$.','ابدأ بـ $@sqrt{x}$ ثم طبق التحويلات.','$g(x) = −@sqrt{x + 2} + 5$']
 ]},

/* ======================= 1-6 ======================= */
{id:'1-6', unit:'u1', title:'العمليات على الدوال وتركيب دالتين', lab:'comp',
 goal:'أجري العمليات الأربع على الدوال، وأركّب دالتين وأحدد مجال التركيب.',
 idea:[
  'يمكن جمع دالتين أو طرحهما أو ضربهما أو قسمتهما لتكوين دالة جديدة، مجالها <b>تقاطع</b> مجالي الدالتين مع استبعاد ما يجعل المقام صفرًا.',
  '<b>تركيب الدوال</b>: $[f∘g](x) = f(g(x))$ ، أي نحسب $g$ أولًا ثم ندخل الناتج في $f$.',
  'مجال $f∘g$ هو قيم $x$ في مجال $g$ التي تكون عندها $g(x)$ في مجال $f$.'
 ],
 tip:'الترتيب مهم: $f(g(x))$ لا تساوي $g(f(x))$ في الغالب. ابدأ دائمًا من الدالة الداخلية.',
 rules:[
  ['الجمع والطرح','$(f ± g)(x) = f(x) ± g(x)$'],
  ['الضرب','$(f·g)(x) = f(x)·g(x)$'],
  ['القسمة','$(@frac{f}{g})(x) = @frac{f(x)}{g(x)} ، g(x) ≠ 0$'],
  ['التركيب','$[f∘g](x) = f(g(x))$'],
  ['مجال التركيب','$x$ في مجال $g$ و $g(x)$ في مجال $f$'],
  ['دالتان عكسيتان','$f(g(x)) = g(f(x)) = x$']
 ],
 rq:[
  ['في $[f∘g](x)$ نبدأ بحساب:',['$f(x)$','$g(x)$','$f(x)·g(x)$','$f(x) + g(x)$'],1,'الدالة الداخلية أولًا.'],
  ['مجال $(@frac{f}{g})(x)$ يستبعد القيم التي تجعل:',['$f(x) = 0$','$g(x) = 0$','$x = 0$','$f(x) = g(x)$'],1,'لا قسمة على صفر.'],
  ['إذا كانت $f(2) = 3 ، g(3) = 2$ فإن $[f∘g](3)$ =',['$2$','$3$','$4$','$5$'],1,'$g(3) = 2$ ثم $f(2) = 3$.']
 ],
 ex:{q:'إذا كانت $f(x) = 6x^{2} − 4$ و $g(x) = x + 2$ فأوجد $[f∘g](x)$ و $[g∘f](x)$ و $[f∘g](3)$.',
  s:['$[f∘g](x) = f(x + 2) = 6(x + 2)^{2} − 4$','$= 6(x^{2} + 4x + 4) − 4 = 6x^{2} + 24x + 20$','$[g∘f](x) = g(6x^{2} − 4) = 6x^{2} − 4 + 2 = 6x^{2} − 2$','$[f∘g](3) = 6(9) + 24(3) + 20 = 146$']},
 qs:[
  ['إذا كانت $f(x) = 2x − 3 ، g(x) = 4x^{2}$ فإن $[f∘g](x)$ =',['$4x^{2} + 2x − 3$','$8x^{2} − 3$','$16x^{2} − 48x + 36$','$8x^{3} − 12x^{2}$'],1,'$f(4x^{2}) = 2(4x^{2}) − 3$'],
  ['إذا كانت $f(x) = x − 3 ، g(x) = 2x − 4$ فإن $(f + g)(x)$ =',['$3x − 7$','$−x − 7$','$−x + 1$','$3x + 1$'],0,'$x − 3 + 2x − 4$'],
  ['إذا كانت $f(x) = x^{2} + 1 ، g(x) = 2x$ فإن $[f∘g](x)$ =',['$2x^{2} + 2$','$2x^{2} + 1$','$x^{2} + 4x + 4$','$4x^{2} + 1$'],3,'$(2x)^{2} + 1$'],
  ['إذا كانت $f(x) = 2x − 3 ، g(x) = 4x − 8$ فإن $[f∘g](6)$ =',['$19$','$16$','$29$','$35$'],2,'$g(6) = 16 ، f(16) = 29$'],
  ['إذا كانت $f(x) = x^{2} + 4 ، g(x) = @sqrt{x}$ فمجال $(f + g)(x)$ :',['$ℝ$','$x < 0$','$x > 0$','$x ≥ 0$'],3,'تقاطع $ℝ$ مع $[0, ∞)$.'],
  ['إذا كانت $f(x) = x − 6 ، g(x) = x^{2} − 36$ فإن $(@frac{f}{g})(x)$ =',['$@frac{1}{x + 5}$','$@frac{1}{x^{2} + 36}$','$@frac{1}{x + 6} ، x ≠ ±6$','$@frac{1}{x − 6}$'],2,'$@frac{x − 6}{(x − 6)(x + 6)}$'],
  ['إذا كانت $f(x) = x^{3} − 1 ، g(x) = x + 7$ فإن $(f − g)(x)$ =',['$x^{3} − x − 8$','$x^{3} + x + 8$','$x^{3} + x + 6$','$x^{3} − x + 8$'],0,'$x^{3} − 1 − x − 7$']
 ],
 hots:[
  ['ربط','محل يخصم $15\%$ على الحاسوب، ومعك قسيمة بخصم $100$ ريال. لتكن $c(x) = 0.85x$ و $d(x) = x − 100$. أي التركيبين يعطي سعرًا أقل: $c∘d$ أم $d∘c$ ؟','احسب كلًّا منهما جبريًا وقارن.','$[c∘d](x) = 0.85x − 85$ ، $[d∘c](x) = 0.85x − 100$ ⇐ $d∘c$ (الخصم أولًا ثم القسيمة) أقل بـ 15 ريالًا.'],
  ['تحليل','أوجد دالتين $f$ و $g$ بحيث $h(x) = @frac{1}{x + 7} = [f∘g](x)$ ولا تكون أي منهما $x$.','ما العملية «الداخلية» وما «الخارجية»؟','$g(x) = x + 7$ و $f(x) = @frac{1}{x}$ .'],
  ['تبرير','هل عملية التركيب إبدالية؟ برّر بمثال.','جرّب $f(x) = x^{2}$ و $g(x) = x + 1$.','لا؛ $f(g(x)) = (x + 1)^{2}$ بينما $g(f(x)) = x^{2} + 1$.']
 ]},

{id:'1-7', unit:'u1', title:'العلاقات والدوال العكسية', lab:'inv',

{id:'3-1', unit:'u3', title:'المتطابقات المثلثية', lab:'unit',
 goal:'أستعمل المتطابقات المثلثية الأساسية لإيجاد قيم الدوال المثلثية وتبسيط العبارات.',
 idea:[
  '<b>المتطابقة المثلثية</b> معادلة تحتوي على دوال مثلثية وتكون صحيحة لجميع القيم المعرّفة.',
  'أهمها متطابقات فيثاغورس، ومصدرها دائرة الوحدة: النقطة $(@cos θ, @sin θ)$ تبعد 1 عن المركز فيكون $@cos^{2}θ + @sin^{2}θ = 1$.',
  'نحدد إشارة الدالة من الربع الذي يقع فيه ضلع الانتهاء.'
 ],
 tip:'قاعدة الإشارات (ASTC): الربع الأول الكل موجب، الثاني $@sin$ ، الثالث $@tan$ ، الرابع $@cos$.',
 rules:[
  ['المتطابقات النسبية','$@tan θ = @frac{@sin θ}{@cos θ} ، @cot θ = @frac{@cos θ}{@sin θ}$'],
  ['متطابقات المقلوب','$@csc θ = @frac{1}{@sin θ} ، @sec θ = @frac{1}{@cos θ} ، @cot θ = @frac{1}{@tan θ}$'],
  ['فيثاغورس ①','$@sin^{2}θ + @cos^{2}θ = 1$'],
  ['فيثاغورس ② و ③','$@tan^{2}θ + 1 = @sec^{2}θ$<br>$@cot^{2}θ + 1 = @csc^{2}θ$'],
  ['الزاويتان المتتامتان','$@sin(90° − θ) = @cos θ ، @cos(90° − θ) = @sin θ$<br>$@tan(90° − θ) = @cot θ ، @sec(90° − θ) = @csc θ$'],
  ['الزوجية والفردية','$@sin(−θ) = −@sin θ ، @cos(−θ) = @cos θ ، @tan(−θ) = −@tan θ$']
 ],
 rq:[
  ['$1 + @tan^{2}θ$ =',['$@csc^{2}θ$','$@sec^{2}θ$','$@cot^{2}θ$','$1$'],1,'فيثاغورس الثانية.'],
  ['$@cos(−θ)$ =',['$−@cos θ$','$@cos θ$','$@sin θ$','$−@sin θ$'],1,'جيب التمام دالة زوجية.'],
  ['في الربع الثاني، الدالة الموجبة هي:',['$@sin$','$@cos$','$@tan$','جميعها'],0,'ASTC: الثاني Sine.'],
  ['$@sin(@frac{π}{2} − θ)$ =',['$@sin θ$','$@cos θ$','$@tan θ$','$−@cos θ$'],1,'الزاويتان المتتامتان.']
 ],

  s:['$@cos^{2}θ = 1 − @sin^{2}θ = 1 − @frac{4}{9} = @frac{5}{9}$','$@cos θ = ±@frac{@sqrt{5}}{3}$','$θ$ في الربع الثاني ⇐ $@cos$ سالب.','$@cos θ = −@frac{@sqrt{5}}{3}$']},
 qs:[
  ['إذا كان $@sin θ = −@frac{18}{19}$ ، $270° < θ < 360°$ ، فإن $@csc θ$ =',['$@frac{19}{18}$','$−@frac{19}{18}$','$@frac{4@sqrt{2}}{9}$','$−@frac{4@sqrt{2}}{9}$'],1,'$@csc$ مقلوب $@sin$.'],
  ['إذا كان $@tan θ = @frac{1}{3}$ فإن $@cot θ$ =',['$4$','$3$','$−3$','$−@frac{1}{3}$'],1,'مقلوب.'],
  ['بسّط $@cot θ @sec θ$ :',['$@sin θ$','$@csc θ$','$@frac{@cos θ}{@sin^{2}θ}$','$@cos θ$'],1,'$@frac{@cos θ}{@sin θ} · @frac{1}{@cos θ}$'],
  ['بسّط $@sin θ(@csc θ − @sin θ)$ :',['$@sin^{2}θ$','$@csc θ$','$@cos^{2}θ$','$@sec θ$'],2,'$1 − @sin^{2}θ$'],
  ['بسّط $3@tan θ@cot θ + 4@sin θ@csc θ + 2@cos θ@sec θ$ :',['$9$','$0$','$5$','$1$'],0,'كل حاصل ضرب مقلوبين $= 1$.'],
  ['بسّط $@frac{1 − @cos^{2}θ}{@tan θ · @sin θ}$ :',['$@sin θ$','$@cos θ$','$@tan θ$','$@cot θ$'],1,'$@frac{@sin^{2}θ}{@sin^{2}θ / @cos θ}$'],
  ['إذا كان $@sec θ = −2$ ، $180° < θ < 270°$ ، فإن $@tan θ$ =',['$@sqrt{3}$','$−@sqrt{3}$','$@frac{@sqrt{3}}{3}$','$3$'],0,'$@tan^{2}θ = 4 − 1 = 3$ ، والظل موجب في الربع الثالث.']
 ],
 hots:[
  ['تحليل','إذا كان $@sin θ = @cos θ$ و $θ$ في الربع الأول، فما $θ$ ؟ وما قيمة $@tan θ$ ؟','اقسم الطرفين على $@cos θ$.','$@tan θ = 1 ⇐ θ = 45°$'],
  ['تبرير','هل يمكن أن يكون $@sin θ = 1.2$ ؟ برّر باستعمال دائرة الوحدة.','ما أكبر إحداثي $y$ على دائرة الوحدة؟','لا؛ لأن $@sin θ$ هو الإحداثي $y$ على دائرة نصف قطرها 1 ، فـ $−1 ≤ @sin θ ≤ 1$.'],
  ['إبداع','اكتب $@tan^{2}θ$ بدلالة $@cos θ$ فقط.','$@tan = @sin / @cos$ ثم فيثاغورس.','$@tan^{2}θ = @frac{1 − @cos^{2}θ}{@cos^{2}θ}$']
 ]},

{id:'4-1', unit:'u4', title:'القطوع المكافئة', lab:'para',

 idea:[
  '<b>القطع المكافئ</b> هو المحل الهندسي لجميع النقاط التي يكون بعدها عن نقطة ثابتة (<b>البؤرة</b>) مساويًا لبعدها عن مستقيم ثابت (<b>الدليل</b>).',
  'عندما ترمي كرة فإنها تتحرك في مسار على شكل قطع مكافئ، وأطباق الاستقبال تجمع الإشارات في البؤرة.',
  'إذا كان الحد المربع هو $x$ فالقطع رأسي (للأعلى أو للأسفل)، وإذا كان $y$ فهو أفقي (لليمين أو لليسار).'
 ],
 tip:'$c$ هي المسافة بين الرأس والبؤرة، وإشارتها تحدد الاتجاه.',
 rules:[

  ['خصائص الرأسي','البؤرة $(h, k + c)$ ، الدليل $y = k − c$ ، المحور $x = h$'],
  ['المفتوح أفقيًا','$(y − k)^{2} = 4c(x − h)$ ؛ لليمين $c > 0$'],
  ['خصائص الأفقي','البؤرة $(h + c, k)$ ، الدليل $x = h − c$ ، المحور $y = k$'],

 ],
 rq:[

{id:'4-2', unit:'u4', title:'القطوع الناقصة والدوائر', lab:'ellipse',
 goal:'أحدد خصائص القطع الناقص والدائرة، وأكتب معادلتيهما.',
 idea:[

  'يمكنك رسمه بخيط مثبت بدبوسين: طول الخيط ثابت = $2a$.',
  'إذا كان $a^{2}$ تحت $(x − h)^{2}$ فالمحور الأكبر أفقي، وإذا كان تحت $(y − k)^{2}$ فهو رأسي.',
  '<b>الدائرة</b> حالة خاصة من القطع الناقص تنطبق فيها البؤرتان على المركز.'
 ],
 tip:'$a$ أكبر المقامين دائمًا ($a > b$ و $a > c$)، والاختلاف المركزي $e = @frac{c}{a}$ بين 0 و 1.',
 rules:[
  ['التعريف','$d_{1} + d_{2} = 2a$'],
  ['المحور الأكبر أفقي','$@frac{(x − h)^{2}}{a^{2}} + @frac{(y − k)^{2}}{b^{2}} = 1$'],
  ['خصائص الأفقي','البؤرتان $(h ± c, k)$ ، الرأسان $(h ± a, k)$ ، المرافقان $(h, k ± b)$'],
  ['العلاقة بين a, b, c','$c^{2} = a^{2} − b^{2}$'],
  ['الأطوال','المحور الأكبر $2a$ ، المحور الأصغر $2b$'],
  ['الاختلاف المركزي','$e = @frac{c}{a} ، 0 < e < 1$'],
  ['الدائرة','$(x − h)^{2} + (y − k)^{2} = r^{2}$ ، المركز منتصف القطر']
 ],
 rq:[
  ['العلاقة بين $a , b , c$ في القطع الناقص:',['$c^{2} = a^{2} + b^{2}$','$c^{2} = a^{2} − b^{2}$','$a = b + c$','$c = a·b$'],1,'البؤرة داخل القطع ⇐ $c < a$.'],
  ['كلما اقترب $e$ من الصفر يصبح القطع الناقص أقرب إلى:',['خط مستقيم','دائرة','قطع مكافئ','قطع زائد'],1,'$c → 0$ ⇐ البؤرتان تقتربان من المركز.'],
  ['مجموع بعدي أي نقطة على القطع الناقص عن البؤرتين يساوي:',['$2b$','$2c$','$2a$','$a + b$'],2,'طول المحور الأكبر.']
 ],

  ['الاختلاف المركزي للقطع $@frac{(x + 5)^{2}}{72} + @frac{(y − 3)^{2}}{54} = 1$ :',['$2$','$0.58$','$0.5$','$0.2$'],2,'$c^{2} = 18 ⇐ e = @frac{3@sqrt{2}}{6@sqrt{2}}$'],
  ['معادلة الدائرة التي مركزها $(−4, −3)$ وقطرها 12 :',['$(x − 4)^{2} + (y − 3)^{2} = 6$','$(x − 4)^{2} + (y − 3)^{2} = 36$','$(x + 4)^{2} + (y + 3)^{2} = 144$','$(x + 4)^{2} + (y + 3)^{2} = 36$'],3,'$r = 6$'],
  ['معادلة الدائرة التي طرفا قطرها $(−4, −10) ، (4, −10)$ :',['$(x − 4)^{2} + (y − 10)^{2} = 4$','$(x − 4)^{2} + (y − 10)^{2} = 16$','$x^{2} + (y − 10)^{2} = 16$','$x^{2} + (y + 10)^{2} = 16$'],3,'المركز $(0, −10)$ ، $r = 4$'],

/* 1-3 الاتصال */

/* 1-4 القيم القصوى ومتوسط معدل التغير */
W.sec = {
  note: 'الأخضر: الدالة متزايدة ، البرتقالي: متناقصة. حرّك $x_{1}$ و $x_{2}$ لترى ميل القاطع.',
  controls: [
    { t: 'seg', id: 'f', label: 'الدالة', v: 'c', opts: [['c', '$x^{3} − 3x$'], ['q', '$−@frac{1}{4}x^{4} + 2x^{2}$']] },
    { t: 'range', id: 'a', label: '$x_{1}$', min: -3, max: 3, step: 0.05, v: -1.5 },
    { t: 'range', id: 'b', label: '$x_{2}$', min: -3, max: 3, step: 0.05, v: 2 },
    { t: 'play', target: 'b', label: 'حرّك x₂', dur: 6 }
  ],
  F: { c: [x => x ** 3 - 3 * x, x => 3 * x * x - 3, [[-1, 'عظمى محلية'], [1, 'صغرى محلية']]], q: [x => -(x ** 4) / 4 + 2 * x * x, x => -(x ** 3) + 4 * x, [[-2, 'عظمى مطلقة'], [0, 'صغرى محلية'], [2, 'عظمى مطلقة']]] },
  draw(P, s) {
    const [f, df, ex] = this.F[s.f], C = P.C; P.square(0, 1, 5.5); P.axes({ sx: 1 });

  },

    return `$m_{sec} = @frac{f(${fmt(s.b)}) − f(${fmt(s.a)})}{${fmt(s.b)} − (${fmt(s.a)})} = @frac{${fmt(fb)} − (${fmt(fa)})}{${fmt(s.b - s.a)}}$<br><span class="big">$m_{sec} ≈ ${fmt(m)}$</span> ${m > 0 ? ok('القاطع صاعد') : m < 0 ? bad('القاطع هابط') : inf('القاطع أفقي')}`;
  }

/* 1-5 الدوال الأم والتحويلات */
const PARENTS = {
  sq: [x => x * x, 'x^{2}', '(x − h)^{2}'], ab: [x => Math.abs(x), '|x|', '|x − h|'], rt: [x => x >= 0 ? Math.sqrt(x) : NaN, '@sqrt{x}', '@sqrt{x − h}'],
  cu: [x => x ** 3, 'x^{3}', '(x − h)^{3}'], re: [x => 1 / x, '@frac{1}{x}', '@frac{1}{x − h}'], fl: [x => Math.floor(x), '[x]', '[x − h]']
};
W.trans = {
  note: 'المنحنى المتقطع هو الدالة الأم، والمتصل هو $g(x) = a·f(x − h) + k$.',
  controls: [
    { t: 'seg', id: 'p', label: 'الدالة الأم', v: 'sq', opts: [['sq', '$x^{2}$'], ['ab', '$|x|$'], ['rt', '$@sqrt{x}$'], ['cu', '$x^{3}$'], ['re', '$@frac{1}{x}$'], ['fl', '$[x]$']] },
    { t: 'range', id: 'a', label: '$a$ (تمدد/انعكاس حول $x$)', min: -3, max: 3, step: 0.25, v: 2 },
    { t: 'range', id: 'h', label: '$h$ (انسحاب أفقي)', min: -5, max: 5, step: 0.5, v: 2 },
    { t: 'range', id: 'k', label: '$k$ (انسحاب رأسي)', min: -5, max: 5, step: 0.5, v: -3 },
    { t: 'seg', id: 'ry', label: 'انعكاس حول المحور $y$ : $f(−x)$', v: 0, opts: [[0, 'لا'], [1, 'نعم']] },
    { t: 'play', target: 'h', label: 'حرّك أفقيًا', dur: 6 }
  ],
  g(s) { const f = PARENTS[s.p][0], sg = s.ry ? -1 : 1; return x => s.a * f(sg * (x - s.h)) + s.k; },
  draw(P, s) {
    const C = P.C, f = PARENTS[s.p][0]; P.square(0, 0, 7); P.axes({ sx: 1 });
    const fl = s.p === 'fl';
    P.fn(f, { col: C.muted, w: 2, dash: [6, 5], key: fl ? Math.floor : null });
    const sg = s.ry ? -1 : 1;
    P.fn(this.g(s), { col: C.c1, w: 3, key: fl ? (x => Math.floor(sg * (x - s.h))) : null });
    if (s.p !== 're' && s.p !== 'fl') P.dot(s.h, s.k, { col: C.c2, r: 5 });
    if (s.p === 're') { P.vline(s.h, { col: C.c2, dash: [4, 4], w: 1.2 }); P.hline(s.k, { col: C.c2, dash: [4, 4], w: 1.2 }); }
  },
  info(s) {
    const t = [];
    if (s.a === 0) return bad('$a$ لا يساوي صفرًا');
    if (s.a < 0) t.push('انعكاس حول المحور $x$');
    if (Math.abs(s.a) > 1) t.push(`توسع رأسي بمعامل $${fmt(Math.abs(s.a))}$`); else if (Math.abs(s.a) < 1) t.push(`تضييق رأسي بمعامل $${fmt(Math.abs(s.a))}$`);
    if (s.ry) t.push('انعكاس حول المحور $y$');
    if (s.h > 0) t.push(`انسحاب $${fmt(s.h)}$ وحدات لليمين`); else if (s.h < 0) t.push(`انسحاب $${fmt(-s.h)}$ وحدات لليسار`);
    if (s.k > 0) t.push(`انسحاب $${fmt(s.k)}$ وحدات لأعلى`); else if (s.k < 0) t.push(`انسحاب $${fmt(-s.k)}$ وحدات لأسفل`);
    const inner = s.h === 0 ? 'x' : `x ${s.h > 0 ? '−' : '+'} ${fmt(Math.abs(s.h))}`;
    const arg = s.ry ? `−(${inner})` : inner;
    const map = { sq: `(${arg})^{2}`, ab: `|${arg}|`, rt: `@sqrt{${arg}}`, cu: `(${arg})^{3}`, re: `@frac{1}{${arg}}`, fl: `[${arg}]` };
    const aa = s.a === 1 ? '' : s.a === -1 ? '−' : fmt(s.a);
    const kk = s.k === 0 ? '' : ` ${s.k > 0 ? '+' : '−'} ${fmt(Math.abs(s.k))}`;
    return `<span class="big">$g(x) = ${aa}${map[s.p]}${kk}$</span><br>${t.length ? t.map(x => '• ' + x).join('<br>') : 'لا تحويلات: $g = f$'}`;
  }
};

/* 1-6 تركيب الدوال */
const CF = { sq: [x => x * x, 'x^{2}'], lin: [x => 2 * x - 3, '2x − 3'], ab: [x => Math.abs(x), '|x|'] };
const CG = { p2: [x => x + 2, 'x + 2'], dbl: [x => 2 * x, '2x'], m1: [x => x - 1, 'x − 1'] };
W.comp = {
  note: 'الكرة تمر في الآلة الداخلية أولًا ثم الخارجية. بدّل الترتيب لترى أن $f(g(x)) ≠ g(f(x))$ غالبًا.',
  anim: true, liveInfo: false, ratio: '1/1.05',
  controls: [
    { t: 'seg', id: 'f', label: '$f(x)$', v: 'sq', opts: [['sq', '$x^{2}$'], ['lin', '$2x − 3$'], ['ab', '$|x|$']] },
    { t: 'seg', id: 'g', label: '$g(x)$', v: 'p2', opts: [['p2', '$x + 2$'], ['dbl', '$2x$'], ['m1', '$x − 1$']] },
    { t: 'seg', id: 'o', label: 'الترتيب', v: 'fg', opts: [['fg', '$[f∘g](x)$'], ['gf', '$[g∘f](x)$']] },

  ],
  draw(P, s, t) {
    const C = P.C, c = P.ctx, W0 = P.W, H0 = P.H, f = CF[s.f][0], g = CG[s.g][0];
    const first = s.o === 'fg' ? [g, 'g'] : [f, 'f'], second = s.o === 'fg' ? [f, 'f'] : [g, 'g'];
    const v1 = first[0](s.x), v2 = second[0](v1);
    const top = H0 * 0.36;
    // الآلة
    const bx = [W0 * 0.30, W0 * 0.70], bw = W0 * 0.18, bh = top * 0.42, by = top * 0.30;
    c.font = `600 14px ${MATHFONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.direction = 'ltr';
    c.strokeStyle = C.axis; c.lineWidth = 1.5; c.setLineDash([4, 4]);
    c.beginPath(); c.moveTo(W0 * 0.06, by + bh / 2); c.lineTo(W0 * 0.94, by + bh / 2); c.stroke(); c.setLineDash([]);
    [[bx[0], first[1], C.c3], [bx[1], second[1], C.c4]].forEach(([x, n, col]) => {
      c.fillStyle = col; c.beginPath(); if (c.roundRect) c.roundRect(x - bw / 2, by, bw, bh, 10); else c.rect(x - bw / 2, by, bw, bh); c.fill();
      c.fillStyle = C.sheet; c.font = `italic 700 20px ${MATHFONT}`; c.fillText(n, x, by + bh / 2);
    });
    c.font = `600 14px ${MATHFONT}`; c.fillStyle = C.ink;
    c.fillText(`x = ${fmt(s.x)}`, W0 * 0.1, by - 12);
    c.fillText(fmt(v1), W0 * 0.5, by - 12);
    c.fillText(fmt(v2), W0 * 0.9, by - 12);
    const ph = RM.matches ? 0.999 : (t / 3) % 1, px = W0 * (0.06 + 0.88 * ph);
    c.beginPath(); c.arc(px, by + bh / 2, 8, 0, 7); c.fillStyle = C.c2; c.fill(); c.strokeStyle = C.sheet; c.lineWidth = 2; c.stroke();
    c.font = `12px ${MATHFONT}`; c.fillStyle = C.muted;
    c.fillText(ph < 0.3 ? fmt(s.x) : ph < 0.7 ? fmt(v1) : fmt(v2), px, by + bh + 16);
    // التمثيل البياني للتركيب
    P.region(8, top + 6, W0 - 16, H0 - top - 14);
    P.win(-4.2, 4.2, -4, 12); P.axes({ sx: 1, sy: 2 });
    const comp = s.o === 'fg' ? (x => f(g(x))) : (x => g(f(x)));
    const other = s.o === 'fg' ? (x => g(f(x))) : (x => f(g(x)));
    P.fn(other, { col: C.muted, w: 1.6, dash: [5, 5] });
    P.fn(comp, { col: C.c1, w: 3 });
    P.dot(s.x, v2, { col: C.c2, r: 6 });
  },
  info(s) {
    const f = CF[s.f], g = CG[s.g], inner = s.o === 'fg' ? g : f, outer = s.o === 'fg' ? f : g;
    const v1 = inner[0](s.x), v2 = outer[0](v1), n1 = s.o === 'fg' ? 'g' : 'f', n2 = s.o === 'fg' ? 'f' : 'g';
    const sw = s.o === 'fg' ? f[0](g[0](s.x)) === g[0](f[0](s.x)) : true;
    return `$${n1}(${fmt(s.x)}) = ${fmt(v1)}$ ثم $${n2}(${fmt(v1)}) = ${fmt(v2)}$<br><span class="big">$[${n2}∘${n1}](${fmt(s.x)}) = ${fmt(v2)}$</span><br>المنحنى المتصل: التركيب المختار ، والمتقطع: الترتيب الآخر.`;
  }
};

/* 1-7 الدوال العكسية */
const INV = {
  lin: [x => 2 * x - 3, x => (x + 3) / 2, -6, 6, true, '2x − 3', '@frac{x + 3}{2}'],
  cub: [x => x ** 3 / 4, x => Math.cbrt(4 * x), -3, 3, true, '@frac{1}{4}x^{3}', '@sqrt[3]{4x}'],
  rt: [x => Math.sqrt(x), x => x * x, 0, 9, true, '@sqrt{x}', 'x^{2} ، x ≥ 0'],
  sq: [x => x * x - 4, null, -3.4, 3.4, false, 'x^{2} − 4', '']
};
W.inv = {
  note: 'حرّك شريط «الانعكاس» ليتحول منحنى $f$ إلى $f^{−1}$ بالانعكاس حول $y = x$ ، وحرّك الخط الأفقي لاختبار التباين.',
  controls: [

    { t: 'play', target: 'm', label: 'شغّل الانعكاس', dur: 3 },
    { t: 'range', id: 'y', label: 'الخط الأفقي $y$', min: -4, max: 5, step: 0.1, v: 1 }
  ],
  draw(P, s) {
    const C = P.C, F = INV[s.f]; P.square(0, 0, 6.5); P.axes({ sx: 1 });
    P.fn(x => x, { col: C.muted, w: 1.5, dash: [6, 5] });
    P.fn(F[0], { col: C.c1, w: 3, from: F[2], to: F[3] });
    const m = s.m;

    this._n = xs.length;
  },
  info(s) {

  P.square(0, 0, 1.45); P.axes({ sx: 0.5, labels: false });
  P.curve(t => Math.cos(t), t => Math.sin(t), 0, 2 * Math.PI, { col: C.axis, w: 1.6 });

    [['A', 1.2, 1.22, 'الكل موجب'], ['S', -1.2, 1.22, 'sin موجب'], ['T', -1.2, -1.12, 'tan موجب'], ['C', 1.2, -1.12, 'cos موجب']].forEach(([L, x, y, d], i) => {

}

  ratio: '1/0.8',

    { t: 'play', target: 'c', label: 'غيّر c', dur: 8 }
  ],
  sols(s) {
    const out = [];
    for (let d = 0; d <= s.r; d += 0.25) {
      const F = { sin: Math.sin, cos: Math.cos, tan: Math.tan }[s.f];
      const a = F(d * D2R) - s.c, b = F((d + 0.25) * D2R) - s.c;
      if (Math.abs(a) < 1e-9) out.push(d); else if (a * b < 0 && Math.abs(a - b) < 1) out.push(d + 0.25 * a / (a - b));
    }
    return out.filter((v, i, A) => !i || v - A[i - 1] > 0.6).filter(v => v <= s.r + 1e-9);
  },
  draw(P, s) {
    const C = P.C, F = { sin: Math.sin, cos: Math.cos, tan: Math.tan }[s.f];

    P.fn(d => F(d * D2R), { col: C.c1, w: 3, from: 0, to: s.r });
    P.hline(s.c, { col: C.c2, w: 2 });

  },
  info(s) {
    if (s.f !== 'tan' && Math.abs(s.c) > 1) return bad(`لا يوجد حل: $−1 ≤ @${s.f} θ ≤ 1$`);
    const L = this.sols(s);
    const per = s.f === 'tan' ? '180°k' : '360°k';
    return `<span class="big">$@${s.f} θ = ${fmt(s.c)}$</span><br>الحلول في الفترة: ${L.length ? L.map(v => '$' + fmt(v, 1) + '°$').join(' ، ') : 'لا يوجد'}<br>عدد الحلول: <b>${L.length}</b><br>الحل العام: كل حل $+ ${per}$`;
  }
};

    const d = s.B * s.B - 4 * s.A * s.C;
    let type;
    if (s.A === 0 && s.B === 0 && s.C === 0) type = bad('ليست قطعًا مخروطيًا (معادلة خطية)');
    else if (d === 0) type = inf('قطع مكافئ');
    else if (d < 0) type = (s.B === 0 && s.A === s.C) ? ok('دائرة') : ok('قطع ناقص');
    else type = bad('قطع زائد');
    const term = (v, t, first) => v === 0 ? '' : `${first ? (v < 0 ? '−' : '') : (v < 0 ? ' − ' : ' + ')}${Math.abs(v) === 1 && t ? '' : fmt(Math.abs(v))}${t}`;
    let eq = ''; [[s.A, 'x^{2}'], [s.B, 'xy'], [s.C, 'y^{2}'], [s.D, 'x'], [s.E, 'y'], [s.F, '']].forEach(([v, t]) => { eq += term(v, t, eq === ''); });
    return `<span class="big">$${eq || '0'} = 0$</span><br>$B^{2} − 4AC = (${fmt(s.B)})^{2} − 4(${fmt(s.A)})(${fmt(s.C)}) = ${fmt(d)}$<br>${type} ${s.B !== 0 ? inf('مائل: $B ≠ 0$') : ''}`;
  }
};

function hash32(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function order(n, seed) { const a = [...Array(n).keys()]; let x = seed || 1; for (let i = n - 1; i > 0; i--) { x = (Math.imul(x, 1103515245) + 12345) >>> 0; const j = x % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function renderQ(host, q, key, onDone) {
  const [text, opts, ans, why] = q, ord = order(opts.length, hash32(key));
  const d = document.createElement('div'); d.className = 'q';
  d.innerHTML = `<div class="qt"><span>${T(text)}</span></div><div class="opts"></div><div class="fb" aria-live="polite"></div>`;
  const box = d.querySelector('.opts'), fb = d.querySelector('.fb'); let tries = 0, done = false;
  ord.forEach((oi, n) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'opt';
    b.innerHTML = `<span class="k">${'ABCD'[n]}</span><span>${T(opts[oi])}</span>`;
    b.addEventListener('click', () => {
      if (done) return; tries++;
      if (oi === ans) {
        b.classList.add('ok'); done = true;
        box.querySelectorAll('.opt').forEach(x => x.disabled = true);
        fb.innerHTML = `<div class="fb-msg ok"><b>${tries === 1 ? praise() : 'صحيح بعد المحاولة!'}</b> ${T(why)}</div>`;
        const first = tries === 1;
        if (!(key in PRO.q)) { PRO.q[key] = first ? 1 : 0; if (first) addXP(10, praise()); else save(); }
        onDone && onDone(first);
      } else {
        b.classList.add('bad'); b.disabled = true;
        if (tries >= 2) {
          done = true; box.querySelectorAll('.opt').forEach((x, i) => { x.disabled = true; if (ord[i] === ans) x.classList.add('ok'); });
          fb.innerHTML = `<div class="fb-msg bad"><b>الإجابة الصحيحة مظللة بالأخضر.</b> ${T(why)}</div>`;
          if (!(key in PRO.q)) { PRO.q[key] = 0; save(); }
          onDone && onDone(false);
        } else fb.innerHTML = `<div class="fb-msg bad">إجابة غير صحيحة. راجع القانون وحاول مرة أخرى.</div>`;
      }
    });
    box.appendChild(b);
  });
  host.appendChild(d);
}
function quizBlock(host, list, prefix) {
  host.innerHTML = '<div class="qs"></div><div class="score-line"><span class="sc"></span><button type="button" class="btn">أعد المحاولة</button></div>';
  const qs = host.querySelector('.qs'), sc = host.querySelector('.sc');
  const upd = () => { const ok = list.filter((_, i) => PRO.q[`${prefix}${i}`] === 1).length; sc.textContent = `صحيحة من المحاولة الأولى: ${ok} من ${list.length}`; buildTOC(location.hash.slice(1)); };
  list.forEach((q, i) => renderQ(qs, q, `${prefix}${i}`, upd));
  host.querySelector('.btn').addEventListener('click', () => { list.forEach((_, i) => delete PRO.q[`${prefix}${i}`]); save(); quizBlock(host, list, prefix); });
  upd();
}

/* ---------- بطاقات الحفظ ---------- */
let flashFilter = 'all', flashOnlyNew = false, flashIdx = 0;
function renderMemorize() {
  const all = []; LESSONS.forEach(l => l.rules.forEach((r, i) => all.push({ l, r, key: `${l.id}:${i}` })));
  let list = all.filter(x => flashFilter === 'all' || x.l.unit === flashFilter);
  if (flashOnlyNew) list = list.filter(x => !PRO.r[x.key]);
  if (flashIdx >= list.length) flashIdx = 0;
  const known = all.filter(x => (flashFilter === 'all' || x.l.unit === flashFilter) && PRO.r[x.key]).length;
  const tot = all.filter(x => flashFilter === 'all' || x.l.unit === flashFilter).length;
  const cur = list[flashIdx];
  main.innerHTML = `<div class="page">
  <section class="sheet"><div class="sec-h"><span class="tag">احفظ</span><h2>بطاقات حفظ القوانين</h2></div>
  <p>اقرأ اسم القانون، قل الصيغة بصوت مسموع، ثم اقلب البطاقة لتتأكد. البطاقات التي تحفظها تخرج من «غير المحفوظة».</p>
  <div class="ctrl"><div class="seg" id="ff">${[['all', 'كل الفصول'], ...UNITS.map(u => [u.id, u.name.split(':')[0]])].map(([v, t]) => `<button type="button" data-v="${v}" class="${flashFilter === v ? 'on' : ''}">${t}</button>`).join('')}<button type="button" data-new="1" class="${flashOnlyNew ? 'on' : ''}">غير المحفوظة فقط</button></div></div>
  <div class="memo-bar"><span>حفظت ${known} من ${tot}</span><div class="meter"><i style="width:${tot ? known / tot * 100 : 0}%"></i></div></div>
  </section>
  ${cur ? `<section class="flash-stage">
    <button type="button" class="flash" id="fc" aria-label="اقلب البطاقة"><div class="in"><div class="fa"><span class="les">${cur.l.id} · ${cur.l.title}</span><span class="nm">${T(cur.r[0])}</span><span class="lab-note">اضغط لتقلب</span></div><div class="fb">${T(cur.r[1])}</div></div></button>
    <div class="lab-note">البطاقة ${flashIdx + 1} من ${list.length}</div>
    <div class="btn-row"><button type="button" class="btn" id="fprev">السابقة</button><button type="button" class="btn" id="fagain">أحتاج مراجعة</button><button type="button" class="btn fill" id="fknow">${PRO.r[cur.key] ? 'محفوظ ✓ التالية' : 'حفظته'}</button><button type="button" class="btn" id="fnext">التالية</button></div>
  </section>` : `<section class="sheet"><p><b>أحسنت!</b> حفظت كل القوانين في هذا الاختيار. جرّب «تحدّي المراجعة» لتثبيتها.</p><a class="btn fill" href="#challenge">ابدأ التحدّي</a></section>`}
  </div>`;
  main.querySelectorAll('#ff button').forEach(b => b.addEventListener('click', () => { if (b.dataset.new) flashOnlyNew = !flashOnlyNew; else flashFilter = b.dataset.v; flashIdx = 0; renderMemorize(); }));
  if (!cur) return;
  $('#fc').addEventListener('click', () => $('#fc').classList.toggle('flip'));
  $('#fprev').addEventListener('click', () => { flashIdx = (flashIdx - 1 + list.length) % list.length; renderMemorize(); });
  $('#fnext').addEventListener('click', () => { flashIdx = (flashIdx + 1) % list.length; renderMemorize(); });
  $('#fagain').addEventListener('click', () => { if (PRO.r[cur.key]) { delete PRO.r[cur.key]; save(); } flashIdx = (flashIdx + 1) % list.length; renderMemorize(); });
  $('#fknow').addEventListener('click', () => { if (!PRO.r[cur.key]) { PRO.r[cur.key] = 1; addXP(5, 'قانون جديد في ذاكرتك'); if (flashOnlyNew) { renderMemorize(); return; } } flashIdx = (flashIdx + 1) % list.length; renderMemorize(); });
}

/* ---------- تحدّي المراجعة ---------- */
let chUnit = 'all';
function renderChallenge() {
  const pool = []; LESSONS.forEach(l => { if (chUnit === 'all' || l.unit === chUnit) { l.rq.forEach(q => pool.push([q, l])); l.qs.forEach(q => pool.push([q, l])); } });
  const pick = order(pool.length, (Date.now() % 100000) + 7).slice(0, 10).map(i => pool[i]);
  main.innerHTML = `<div class="page"><section class="sheet"><div class="sec-h"><span class="tag">راجع</span><h2>تحدّي المراجعة: 10 أسئلة عشوائية</h2></div>
  <div class="ctrl"><div class="seg" id="cu">${[['all', 'كل الفصول'], ...UNITS.map(u => [u.id, u.name.split(':')[0]])].map(([v, t]) => `<button type="button" data-v="${v}" class="${chUnit === v ? 'on' : ''}">${t}</button>`).join('')}</div></div>
  <p class="lab-note">كل إجابة صحيحة من أول محاولة = نقطة. حاول أن تصل إلى 8 من 10.</p></section>
  <section class="sheet"><div class="qs" id="chq"></div><div class="score-line"><span id="chs">النتيجة: 0 من 10</span><button type="button" class="btn fill" id="chn">أسئلة جديدة</button></div><div id="chr"></div></section></div>`;
  let done = 0, score = 0; const box = $('#chq');
  pick.forEach(([q, l], i) => {
    const wrap = document.createElement('div'); box.appendChild(wrap);
    renderQ(wrap, [q[0] + ` <span class="lab-note">(درس ${l.id})</span>`, q[1], q[2], q[3]], `ch:${Date.now()}:${i}`, first => {
      done++; if (first) score++;
      $('#chs').textContent = `النتيجة: ${score} من ${pick.length}`;
      if (done === pick.length) {
        const msg = score >= 9 ? 'مستوى ممتاز! أنت جاهز للاختبار.' : score >= 7 ? 'جيد جدًا. راجع الدروس التي أخطأت فيها.' : 'لا بأس، ارجع إلى قوانين الدروس ثم أعد التحدّي.';
        $('#chr').innerHTML = `<div class="tip"><b>${score} من ${pick.length}</b> — ${msg}</div>`;
        if (score >= 8) addXP(30, 'تحدٍّ مكتمل');
      }
    });
  });
  main.querySelectorAll('#cu button').forEach(b => b.addEventListener('click', () => { chUnit = b.dataset.v; renderChallenge(); }));
  $('#chn').addEventListener('click', renderChallenge);
}

/* ---------- التوجيه ---------- */
function route() {
  const h = location.hash.slice(1) || 'home';
  LABS.forEach(l => { l.io && l.io.disconnect(); }); LABS.clear();
  if (h.startsWith('l-')) { const L = LESSONS.find(x => 'l-' + x.id === h); if (L) renderLesson(L); else renderHome(); }
  else if (h === 'memorize') renderMemorize();
  else if (h === 'challenge') renderChallenge();
  else if (h === 'index') renderIndex();
  else if (h.startsWith('sheet-')) { const S = SHEETS.find(x => 'sheet-' + x.id === h); if (S) renderSheet(S); else renderHome(); }
  else if (h.startsWith('s-')) { const L = LESSONS.find(x => 's-' + x.id === h); if (L) renderLessonSummary(L); else renderHome(); }
  else renderHome();
  buildTOC(h);
  closeMenu();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
function closeMenu() { toc.classList.remove('open'); $('#ov').classList.remove('show'); document.body.classList.remove('no-scroll'); }
$('#menu').addEventListener('click', () => { const o = !toc.classList.contains('open'); if (!o) { closeMenu(); return; } toc.classList.add('open'); $('#ov').classList.add('show'); document.body.classList.add('no-scroll'); toc.scrollTop = 0; });
$('#ov').addEventListener('click', closeMenu);
toc.addEventListener('click', e => { if (e.target.closest('a')) closeMenu(); });
updateXP();
route();
</script>
</body>
</html>
